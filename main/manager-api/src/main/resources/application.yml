# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /xiaozhi
    session:
      cookie:
        http-only: true

spring:
  # Environment dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true

knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin
  setting:
    enableFooter: false

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

# SSO (OAuth2/OIDC) login — Google / Apple / Microsoft / GitHub.
# Each provider is enabled by supplying its client-id, client-secret and redirect-uri.
# The passcode is a required second factor the user must enter after SSO authentication.
xiaozhi:
  sso:
    enabled: false
    passcode: ""
    frontend-redirect-url: ""
    providers:
      google:
        client-id: ""
        client-secret: ""
        redirect-uri: ""
      apple:
        client-id: ""
        client-secret: ""
        redirect-uri: ""
        team-id: ""
        key-id: ""
      microsoft:
        client-id: ""
        client-secret: ""
        redirect-uri: ""
      github:
        client-id: ""
        client-secret: ""
        redirect-uri: ""

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  # Entity scanning; multiple packages separated by comma or semicolon
  typeAliasesPackage: xiaozhi.modules.*.entity
  global-config:
    # Database-related configuration
    db-config:
      # Primary key type
      id-type: ASSIGN_ID
    banner: false
  # Native configuration
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE