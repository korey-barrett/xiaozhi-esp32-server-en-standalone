  CustomTTS:
    # Custom TTS endpoint service; request parameters can be customized and it can integrate with many TTS services
    # Using a locally deployed KokoroTTS as an example
    # If you only have CPU: docker run -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:latest
    # If you only have GPU: docker run --gpus all -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-gpu:latest
    # The endpoint must accept POST requests and return an audio file
    type: custom
    method: POST
    url: "http://127.0.0.1:8880/v1/audio/speech"
    params: # Custom request parameters
      input: "{prompt_text}"
      response_format: "mp3"
      download_format: "mp3"
      voice: "zf_xiaoxiao"
      lang_code: "z"
      return_download_link: true
      speed: 1
      stream: false
    headers: # Custom request headers
      # Authorization: Bearer xxxx
    format: mp3 # Audio format returned by the endpoint
    output_dir: tmp/
    # language: "zh"  # Output language, e.g. Chinese, English, Japanese, Korean, etc.; set according to the voice's supported languages. Leave empty to default to Chinese
