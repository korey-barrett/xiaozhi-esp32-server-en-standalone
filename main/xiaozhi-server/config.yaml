TTS:
  # Currently supported types: edge, doubao; adapt as needed
  EdgeTTS:
    # Defines the TTS API type
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
    # language: "zh"  # Output language, e.g. Chinese, English, Japanese, Korean, etc.; set according to the voice's supported languages. Leave empty to default to Chinese
  DoubaoTTS:
    # Defines the TTS API type
    type: doubao
    # Volcano Engine speech synthesis service; first create an app in the Volcano Engine console and obtain appid and access_token
    # Volcano Engine speech must be purchased; starting price 30 CNY gives 100 concurrent calls. The free tier only allows 2 concurrent calls and frequently throws TTS errors
    # After purchasing the service and voice, you may need to wait about half an hour before it can be used.
    # Enable standard voices here: https://console.volcengine.com/speech/service/8
    # Enable the Wanwan Xiaohe voice here: https://console.volcengine.com/speech/service/10007; after enabling, set voice below to zh_female_wanwanxiaohe_moon_bigtts
    api_url: https://openspeech.bytedance.com/api/v1/tts
    voice: BV001_streaming
    output_dir: tmp/
    authorization: "Bearer;"
    appid: YOUR_VOLCENGINE_TTS_APP_ID
    access_token: YOUR_VOLCENGINE_TTS_ACCESS_TOKEN
    cluster: volcano_tts
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
    # language: "zh"  # Output language, e.g. Chinese, English, Japanese, Korean, etc.; set according to the voice's supported languages. Leave empty to default to Chinese
  # Volcano TTS, supports bidirectional streaming TTS
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    # Visit https://console.volcengine.com/speech/service/10007 to enable the LLM speech synthesis and purchase a voice
    # Get appid and access_token at the bottom of the page
    # Resource ID is fixed: volc.service_type.10029 (LLM speech synthesis and mixing)
    # For Gizwits, change the endpoint to wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits does not require appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: YOUR_VOLCENGINE_TTS_APP_ID
    access_token: YOUR_VOLCENGINE_TTS_ACCESS_TOKEN
    resource_id: volc.service_type.10029
    speaker: zh_female_wanwanxiaohe_moon_bigtts
    # Enable WebSocket connection reuse (enabled by default). Note: with reuse, idle connections while the device is listening count toward concurrency
    enable_ws_reuse: True
    # Related parameter docs: https://www.volcengine.com/docs/6561/1329505
    # Audio output configuration (audio_params) - you can add any Volcano Engine audio parameter supported
    audio_params:
      speech_rate: 0  # Speech rate (-50~100)
      loudness_rate: 0  # Loudness (-50~100)
      # Multi-emotion voice parameters. Note: only some voices support emotion settings.
      # Related voice list: https://www.volcengine.com/docs/6561/1257544
      # emotion: "neutral"  # Emotion type (only some voices support it): neutral, happy, sad, angry, fearful, disgusted, surprised
      # emotion_scale: 4  # Emotion intensity (1~5)
    # Advanced text processing configuration (additions) - you can add any advanced Volcano Engine parameter supported
    additions:
      post_process:
        pitch: 0  # Pitch (-12~12)
      # aigc_metadata: {}  # AIGC metadata configuration
      # cache_config: {}  # Cache configuration
    # Mixing control configuration (mix_speaker) - multi-voice mixing (TTS 1.0 only)
    # Mixing mainly applies to Doubao speech synthesis model 1.0 voices; when used, set req_params.speaker to custom_mix_bigtts
