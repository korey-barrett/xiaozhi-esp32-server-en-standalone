    url: ws://127.0.0.1:8092/paddlespeech/tts/streaming  # URL of the TTS service pointing to your local server [websocket default ws://127.0.0.1:8092/paddlespeech/tts/streaming, http default http://127.0.0.1:8090/paddlespeech/tts]
